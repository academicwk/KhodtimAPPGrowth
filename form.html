<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>บันทึกน้ำหนักส่วนสูง</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { font-family: 'Sarabun', sans-serif; -webkit-touch-callout: none; user-select: none; }
        .input-field { width: 100%; padding: 0.75rem 1rem; border: 1px solid #e5e7eb; border-radius: 0.5rem; outline: none; font-size: 1rem; background-color: #f9fafb; transition: all 0.2s; text-align: center; font-weight: bold; }
        .input-field:focus:not(:read-only) { border-color: #3b82f6; background-color: #ffffff; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
        .input-field:read-only { background-color: #f3f4f6; color: #4b5563; cursor: not-allowed; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-24">

    <div class="max-w-md mx-auto bg-gray-50 min-h-screen shadow-md relative pb-24">
        <div class="bg-blue-600 text-white p-4 rounded-b-3xl shadow-lg relative">
            <div class="flex justify-between items-start">
                <div class="flex items-center space-x-3">
                    <img src="https://img2.pic.in.th/4d3a830f3eb506411.png" class="w-10 h-10 bg-white rounded-full p-1 shadow">
                    <div>
                        <p class="text-sm opacity-90" id="header-period">ประจำเดือน...</p>
                        <p id="teacher-profile" class="font-bold text-lg leading-tight">ผู้บันทึก: กำลังโหลด...</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="readonly-banner" class="hidden px-4 mt-4">
            <div class="bg-amber-100 border-l-4 border-amber-500 text-amber-800 p-3 rounded-r-lg shadow-sm text-sm">
                <p class="font-bold"><i class="fa-solid fa-lock"></i> โหมดอ่านอย่างเดียว</p>
                <p class="text-xs mt-0.5">ระบบจะเปิดให้บันทึก/แก้ไขข้อมูลได้เฉพาะช่วงวันที่ 16 ถึง วันสุดท้ายของเดือนเท่านั้น</p>
            </div>
        </div>

        <form id="recordForm" class="px-4 mt-4 space-y-4">
            <div class="bg-white rounded-xl shadow p-4 border border-gray-100 relative overflow-hidden">
                <div class="absolute top-0 right-0 bg-blue-100 text-blue-800 font-black px-4 py-1 rounded-bl-xl text-lg" id="displaySno">เลขที่ -</div>
                <p class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-1">ข้อมูลนักเรียน</p>
                <h3 class="text-xl font-bold text-gray-800 leading-tight mb-1" id="displayFullname">ชื่อ-สกุล</h3>
                <p class="text-sm text-gray-500 font-medium">รหัสประจำตัว: <span id="displaySid" class="text-gray-800"></span></p>
            </div>

            <div class="bg-white rounded-xl shadow p-4 border border-gray-100">
                <h3 class="text-sm font-bold text-blue-800 border-b pb-2 mb-3"><i class="fa-solid fa-scale-balanced"></i> ข้อมูลการเจริญเติบโต</h3>
                
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1 text-center">น้ำหนัก (กิโลกรัม) <span class="text-red-500">*</span></label>
                        <input type="number" id="weight" step="0.1" min="10" max="150" required class="input-field text-blue-600" placeholder="0.0" oninput="calculateBMI()">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1 text-center">ส่วนสูง (เซนติเมตร) <span class="text-red-500">*</span></label>
                        <input type="number" id="height" step="0.1" min="50" max="220" required class="input-field text-blue-600" placeholder="0.0" oninput="calculateBMI()">
                    </div>
                </div>

                <div class="bg-gray-50 p-3 rounded-lg border border-gray-200">
                    <label class="block text-xs font-bold text-gray-500 mb-1 text-center uppercase tracking-wide">ดัชนีมวลกาย (BMI)</label>
                    <input type="text" id="bmi" readonly class="w-full bg-transparent text-center text-3xl font-black text-gray-800 mb-2 outline-none" value="0.00">
                    
                    <label class="block text-[10px] font-bold text-gray-400 mb-1 text-center uppercase">ผลการประเมินเบื้องต้น</label>
                    <input type="text" id="result" readonly class="w-full bg-transparent text-center text-sm font-bold text-blue-600 outline-none" value="-">
                </div>
            </div>

            <div class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-40 max-w-md mx-auto">
                <div class="flex gap-2">
                    <button type="button" onclick="backToList()" class="w-1/3 bg-gray-500 hover:bg-gray-600 text-white font-bold py-3.5 rounded-xl text-sm transition shadow-md flex justify-center items-center gap-1">
                        <i class="fa-solid fa-arrow-left"></i> กลับ
                    </button>
                    <button type="submit" id="submitBtn" class="w-2/3 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg flex justify-center items-center gap-2 transition text-base">
                        <i class="fa-solid fa-floppy-disk"></i> บันทึกข้อมูล
                    </button>
                </div>
            </div>
        </form>
    </div>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzTh56DQWZ5J2pcrUFFgv9qF_vYISHAooCny1JADySXvtZv_AZ2NXyiJ82eIv3rncTcZQ/exec";

        // รับค่าพารามิเตอร์จาก URL
        const urlParams = new URLSearchParams(window.location.search);
        const studentSid = urlParams.get('sid');
        const teacherRoom = urlParams.get('room');
        const teacherName = urlParams.get('tname');
        const term = urlParams.get('term');
        const month = urlParams.get('month');
        const fullname = urlParams.get('fullname');
        const sno = urlParams.get('sno');

        if(!studentSid || !teacherRoom) { window.location.href = 'index.html'; }

        document.addEventListener("DOMContentLoaded", () => {
            // แสดงข้อมูลบนหน้าจอ
            document.getElementById('teacher-profile').innerText = `คุณครู${teacherName || "ผู้บันทึก"}`;
            document.getElementById('header-period').innerText = `เดือน${month} (ภาคเรียน ${term})`;
            
            document.getElementById('displaySno').innerText = `เลขที่ ${sno}`;
            document.getElementById('displayFullname').innerText = fullname;
            document.getElementById('displaySid').innerText = studentSid;

            // ตรวจสอบวันที่เพื่อทำ Read-only
            const today = new Date().getDate();
            if (today < 16) {
                document.getElementById('readonly-banner').classList.remove('hidden');
                document.getElementById('submitBtn').classList.add('hidden');
                document.getElementById('weight').readOnly = true;
                document.getElementById('height').readOnly = true;
            }

            loadExistingData();
        });

        // ฟังก์ชันดึงข้อมูลเดิมมาแสดง (ถ้ามี)
        function loadExistingData() {
            Swal.fire({ title: 'กำลังดึงข้อมูล...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
            
            fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "getRecord", sid: studentSid, term: term, month: month }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            })
            .then(res => res.json())
            .then(result => {
                Swal.close();
                if (result.status === 'success') {
                    document.getElementById('weight').value = result.weight;
                    document.getElementById('height').value = result.height;
                    document.getElementById('bmi').value = result.bmi;
                    document.getElementById('result').value = result.result;
                    
                    // เปลี่ยนสีผลประเมินตามเกณฑ์เดิม
                    updateResultColor(result.result);
                }
            })
            .catch(err => { Swal.close(); }); 
        }

        // ฟังก์ชันคำนวณ BMI อัตโนมัติ (เกณฑ์มาตรฐานทั่วไป)
        function calculateBMI() {
            let w = parseFloat(document.getElementById('weight').value);
            let h = parseFloat(document.getElementById('height').value);
            
            if (w > 0 && h > 0) {
                let hMeter = h / 100;
                let bmi = (w / (hMeter * hMeter)).toFixed(2);
                document.getElementById('bmi').value = bmi;

                let resultTxt = "";
                if (bmi < 18.5) resultTxt = "น้ำหนักน้อย / ผอม";
                else if (bmi >= 18.5 && bmi <= 22.9) resultTxt = "ปกติ (สมส่วน)";
                else if (bmi >= 23.0 && bmi <= 24.9) resultTxt = "ท้วม / เริ่มอ้วน";
                else if (bmi >= 25.0 && bmi <= 29.9) resultTxt = "อ้วน";
                else resultTxt = "อ้วนมาก";

                document.getElementById('result').value = resultTxt;
                updateResultColor(resultTxt);
            } else {
                document.getElementById('bmi').value = "0.00";
                document.getElementById('result').value = "-";
            }
        }

        function updateResultColor(resultTxt) {
            const resultEl = document.getElementById('result');
            resultEl.className = "w-full bg-transparent text-center text-sm font-bold outline-none ";
            if (resultTxt.includes("ปกติ")) resultEl.classList.add("text-green-600");
            else if (resultTxt.includes("ผอม")) resultEl.classList.add("text-blue-500");
            else if (resultTxt.includes("ท้วม")) resultEl.classList.add("text-amber-500");
            else resultEl.classList.add("text-red-500");
        }

        function backToList() {
            window.location.href = `students.html?room=${encodeURIComponent(teacherRoom)}&tname=${encodeURIComponent(teacherName)}&term=${encodeURIComponent(term)}&month=${encodeURIComponent(month)}`;
        }

        // กดบันทึกข้อมูล
        document.getElementById('recordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; 
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> กำลังบันทึก...';
            
            try {
                const payload = {
                    action: "saveRecord",
                    term: term,
                    month: month,
                    room: teacherRoom,
                    sid: studentSid,
                    sno: sno,
                    fullname: fullname,
                    weight: document.getElementById('weight').value,
                    height: document.getElementById('height').value,
                    bmi: document.getElementById('bmi').value,
                    result: document.getElementById('result').value
                };

                const res = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const result = await res.json();
                
                if (result.status === 'success') {
                    Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ!', text: 'ข้อมูลถูกส่งเข้าฐานข้อมูลแล้ว', timer: 1500, showConfirmButton: false }).then(() => { 
                        backToList();
                    });
                } else {
                    Swal.fire('ล้มเหลว', result.message, 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> บันทึกข้อมูล';
                }
            } catch (error) { 
                Swal.fire('Error', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้', 'error'); 
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> บันทึกข้อมูล';
            } 
        });
    </script>
</body>
</html>
