<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ระบบบันทึกน้ำหนักส่วนสูง KhodtimAPP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            -webkit-touch-callout: none; 
            -webkit-user-select: none; 
            user-select: none; 
        }
        .login-bg {
            background-image: url('https://images.unsplash.com/photo-1577896851231-70ef18881754?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen relative pb-20">

  <div id="login-view" class="min-h-screen flex flex-col items-center justify-center relative login-bg">
    <div class="absolute inset-0 bg-black bg-opacity-50"></div>
    <div class="relative z-10 w-full max-w-sm px-6 flex flex-col items-center">
      <div class="bg-white p-6 rounded-2xl shadow-xl w-full mb-6">
        <img src="https://img2.pic.in.th/KhodtimAPP.png" alt="Logo" class="w-auto h-28 mb-4 flex-col items-center mx-auto">
        <h2 class="text-center font-bold text-blue-700 mb-4 text-base border-b pb-2">ระบบบันทึกน้ำหนักส่วนสูงนักเรียน</h2>
        
        <div class="mb-3">
          <label class="block text-gray-700 text-xs font-bold mb-1">ชื่อผู้ใช้ (Username)</label>
          <input type="text" id="username" class="w-full px-4 py-2.5 rounded-lg border focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        </div>
        <div class="mb-3">
          <label class="block text-gray-700 text-xs font-bold mb-1">รหัสผ่าน (Password)</label>
          <input type="password" id="password" class="w-full px-4 py-2.5 rounded-lg border focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        </div>

        <div class="grid grid-cols-2 gap-2 mb-5">
          <div>
            <label class="block text-gray-700 text-xs font-bold mb-1">ภาคเรียน/ปีการศึกษา</label>
            <select id="term" class="w-full px-2 py-2 rounded-lg border focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs font-bold bg-gray-50 text-blue-900">
              <option value="1/2569">1/2569</option>
              <option value="2/2569">2/2569</option>
              <option value="1/2568">1/2568</option>
              <option value="2/2568">2/2568</option>
            </select>
          </div>
          <div>
            <label class="block text-gray-700 text-xs font-bold mb-1">เดือนที่บันทึกข้อมูล</label>
            <select id="recordMonth" class="w-full px-2 py-2 rounded-lg border focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs font-bold bg-gray-50 text-blue-900">
              <option value="มกราคม">มกราคม</option>
              <option value="กุมภาพันธ์">กุมภาพันธ์</option>
              <option value="มีนาคม">มีนาคม</option>
              <option value="เมษายน">เมษายน</option>
              <option value="พฤษภาคม">พฤษภาคม</option>
              <option value="มิถุนายน">มิถุนายน</option>
              <option value="กรกฎาคม">กรกฎาคม</option>
              <option value="สิงหาคม">สิงหาคม</option>
              <option value="กันยายน">กันยายน</option>
              <option value="ตุลาคม">ตุลาคม</option>
              <option value="พฤศจิกายน">พฤศจิกายน</option>
              <option value="ธันวาคม">ธันวาคม</option>
            </select>
          </div>
        </div>

        <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md transition duration-200 text-sm">
          เข้าสู่ระบบ
        </button>
      </div>
    </div>
  </div>

<script>
    // หมายเหตุ: URL นี้จะถูกเรียกใช้ชั่วคราวตามโครงสร้างแอปเดิมของคุณครู
    const GAS_WEB_APP_URL = ScriptApp.getService().getUrl();

    document.addEventListener("DOMContentLoaded", () => {
      // ตรวจสอบและตั้งค่าล่วงหน้าเป็นเดือนปัจจุบันเพื่อความสะดวกในการใช้งาน
      const months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
      const currentMonthName = months[new Date().getMonth()];
      document.getElementById('recordMonth').value = currentMonthName;
      
      checkLocalSession(); 
    });

    async function checkLocalSession() {
      const storedUser = localStorage.getItem("weightRecordUser");
      if (storedUser) {
        try {
          const u = JSON.parse(storedUser);
          const term = document.getElementById('term').value;
          const month = document.getElementById('recordMonth').value;

          const response = await fetch(GAS_WEB_APP_URL, {
            method: 'POST', 
            body: JSON.stringify({ action: "login", username: u.username, password: u.password }),
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }
          });
          const result = await response.json();
          if (result.status === "success") {
            window.location.href = `${GAS_WEB_APP_URL}?page=students&room=${encodeURIComponent(result.teacherRoom)}&tname=${encodeURIComponent(result.teacherName)}&term=${encodeURIComponent(term)}&month=${encodeURIComponent(month)}`;
          } else {
            localStorage.removeItem("weightRecordUser");
          }
        } catch (error) { 
           // ปล่อยผ่านหากเซสชันหมดอายุหรือยังไม่ได้ล็อกอิน
        }
      }
    }

    async function handleLogin() {
      const user = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value.trim();
      const term = document.getElementById('term').value;
      const month = document.getElementById('recordMonth').value;

      if(!user || !pass) { Swal.fire("แจ้งเตือน", "กรุณากรอกข้อมูลให้ครบถ้วน", "warning"); return; }

      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST', 
          body: JSON.stringify({ action: "login", username: user, password: pass }),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        });
        const result = await response.json();
        if (result.status === "success") {
          localStorage.setItem("weightRecordUser", JSON.stringify({username: user, password: pass}));
          Swal.fire({ title: 'สำเร็จ!', text: 'เข้าสู่ระบบเรียบร้อย', icon: 'success', timer: 1500, showConfirmButton: false }).then(() => {
              window.location.href = `${GAS_WEB_APP_URL}?page=students&room=${encodeURIComponent(result.teacherRoom)}&tname=${encodeURIComponent(result.teacherName)}&term=${encodeURIComponent(term)}&month=${encodeURIComponent(month)}`;
          });
        } else { Swal.fire("ข้อผิดพลาด", result.message, "error"); }
      } catch (error) { Swal.fire("ข้อผิดพลาด", "เชื่อมต่อฐานข้อมูลไม่สำเร็จ", "error"); }
    }
  </script>
</body>
</html>
